services:
  neo4j:
    image: neo4j:5-community
    container_name: crimi_neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/doublerrraaftaar
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "doublerrraaftaar", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crimi_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Inside Docker, "localhost" is the backend container, not Neo4j.
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma_db
      - ./backend/models:/app/models
      - app_data:/app/data
      - app_uploads:/app/uploads

volumes:
  neo4j_data:
  neo4j_logs:
  chroma_data:
  app_data:
  app_uploads:
