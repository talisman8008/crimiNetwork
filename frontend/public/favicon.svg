<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" role="img" aria-label="NETRA">
  <title>NETRA</title>

  <!-- Layered shield: navy outer, gold band, white field -->
  <path d="M60 3 L113 16 V76 C113 106 90 127 60 137 C30 127 7 106 7 76 V16 Z" fill="#0f2c4e"/>
  <path d="M60 9.5 L106.5 21 V76 C106.5 102 86.5 121 60 130 C33.5 121 13.5 102 13.5 76 V21 Z" fill="#c9a227"/>
  <path d="M60 16 L100 26 V76 C100 98.5 83.5 115 60 123 C36.5 115 20 98.5 20 76 V26 Z" fill="#ffffff"/>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Network lattice woven through the eye -->
    <g stroke="#c9a227" stroke-width="1.4" fill="none" opacity="0.95">
      <path d="M35 46 L47 55 L60 44 L74 55 L86 46"/>
      <path d="M33 74 L47 68 L60 79 L74 68 L88 74"/>
      <path d="M47 55 L47 68 M74 55 L74 68 M60 44 L60 79"/>
      <path d="M35 46 L33 74 M86 46 L88 74"/>
    </g>
    <g stroke="#0f2c4e" stroke-width="1.4" fill="none" opacity="0.9">
      <path d="M47 55 L74 68 M74 55 L47 68"/>
      <path d="M42 62 L60 44 L78 62 L60 79 Z"/>
    </g>

    <!-- Eye outline -->
    <path d="M26 62 C39 43 81 43 94 62 C81 81 39 81 26 62 Z"
          fill="none" stroke="#0f2c4e" stroke-width="4.2"/>

    <!-- Iris and pupil -->
    <circle cx="60" cy="62" r="15" fill="#ffffff" stroke="#0f2c4e" stroke-width="3"/>
    <circle cx="60" cy="62" r="14.5" fill="none" stroke="#c9a227" stroke-width="1.2" opacity="0.9"/>
    <circle cx="60" cy="62" r="7.5" fill="#0f2c4e"/>
    <circle cx="56.6" cy="58.6" r="2.4" fill="#ffffff" opacity="0.95"/>

    <!-- Lattice nodes -->
    <g fill="#0f2c4e">
      <circle cx="60" cy="44" r="3"/>
      <circle cx="35" cy="46" r="2.6"/>
      <circle cx="86" cy="46" r="2.6"/>
      <circle cx="60" cy="79" r="3"/>
    </g>
    <g fill="#c9a227">
      <circle cx="47" cy="55" r="2.4"/>
      <circle cx="74" cy="55" r="2.4"/>
      <circle cx="47" cy="68" r="2.4"/>
      <circle cx="74" cy="68" r="2.4"/>
      <circle cx="33" cy="74" r="2.4"/>
      <circle cx="88" cy="74" r="2.4"/>
    </g>
  </g>
</svg>
